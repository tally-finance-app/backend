version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/account/queries.sql"
    gen:
      go:
        package: "generated"
        out: "internal/platform/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
