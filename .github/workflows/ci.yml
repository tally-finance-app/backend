name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  # Everything that needs no database. Steps are Makefile targets so that a
  # green `make ci` locally means a green pipeline — sqlc and golangci-lint are
  # pinned as go.mod tool dependencies, so there is nothing to install and no
  # way for CI to run a different version than a developer does.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: go mod download

      # Tools live in the separate tools/ module and are compiled into ./bin.
      # Cached on tools/go.sum so they're only rebuilt when a pinned version
      # changes — the versions themselves come from tools/go.mod, so CI and a
      # developer's machine always run identical binaries.
      - name: Cache development tools
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/go.sum') }}

      - name: Build development tools
        run: make tools

      # Generated code is committed, so the useful check is that it still
      # matches migrations/ and the queries files. Regenerating here instead
      # would hide staleness — CI would go green against code no one reviewed.
      - name: Verify generated code is up to date
        run: make verify-generate

      - name: Build
        run: make build

      - name: Go Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match docker-compose.yml — testing against a different major
        # version than you develop on defeats the point of using real Postgres.
        image: postgres:18
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tally:tally@localhost:5432/tally_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: go mod download

      # up -> down -> up, so a broken .down.sql fails the build. Nothing else
      # exercises the down migrations.
      - name: Verify migrations round-trip
        run: make migrate-verify

      - name: Integration tests
        run: make test-integration
