version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    # A glob, not a fixed path, so each domain package can own its own
    # queries.sql (the convention from TALLY-133) without editing this file.
    queries:
      - "internal/*/queries.sql"
    gen:
      go:
        package: "generated"
        out: "internal/platform/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
