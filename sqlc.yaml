version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    # A glob, not a fixed path, so each domain gets its own <domain>_queries.sql
    # (the convention from TALLY-133, corrected post-review to live under
    # platform/postgres rather than the domain package — see CLAUDE.md §3:
    # the domain package owns only the entity, the repository interface, and
    # the service; raw SQL is a Postgres-adapter concern) without editing this
    # file as new domains are added.
    queries:
      - "internal/platform/postgres/*_queries.sql"
    gen:
      go:
        package: "generated"
        out: "internal/platform/postgres/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
